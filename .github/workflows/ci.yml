name: independent-svb
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m svb.cli validate
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m svb.cli experiment --output results/local/ci
