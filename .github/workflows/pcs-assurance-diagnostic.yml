name: pcs-assurance-diagnostic
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python research/pcs-assurance-v1/verify_artifacts.py
      - run: python research/pcs-assurance-v1/analyze.py
      - run: git diff --exit-code -- research/pcs-assurance-v1/results/analysis.json
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m svb.phase3 validate
